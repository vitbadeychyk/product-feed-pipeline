name: Update product feed

on:
  schedule:
    - cron: '0 */4 * * *'

  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # SUPPLIER FEED
      # ======================================================

      # Автоматичне завантаження supplier_feed.xml
      # наразі вимкнене.
      #
      # Якщо потрібно буде знову автоматично
      # завантажувати XML постачальника —
      # розкоментуй блок нижче.
      #
      # - name: Fetch supplier feed
      #   run: python -m scripts.common.fetch_supplier_feed

      # ======================================================
      # CHECK SUPPLIER XML
      # ======================================================

      - name: Check supplier XML
        run: |
          echo "========================================"
          echo "SUPPLIER XML CHECK"
          echo "========================================"

          if [ ! -f data/raw/supplier_feed.xml ]; then
            echo "ERROR: data/raw/supplier_feed.xml not found"
            exit 1
          fi

          echo "Supplier XML found."

          echo
          echo "===== FILE SIZE ====="
          ls -lh data/raw/supplier_feed.xml

          echo
          echo "===== FIRST 1500 SYMBOLS ====="
          head -c 1500 data/raw/supplier_feed.xml
          echo

          echo
          echo "===== LAST 1500 SYMBOLS ====="
          tail -c 1500 data/raw/supplier_feed.xml
          echo

          echo
          echo "===== CHECK TEST SUPPLIER SKU ====="
          grep -n "M 4259EBLR-1" data/raw/supplier_feed.xml \
            || echo "M 4259EBLR-1 NOT FOUND IN RAW"

      # ======================================================
      # GOOGLE
      # ======================================================

      - name: Create Google credentials file
        run: |
          cat > service_account.json <<'EOF'
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Update Google Sheet stock
        run: python -m scripts.google.update_stock

      # ======================================================
      # EPICENTR - FULL FEED
      # ======================================================

      - name: Export Epicentr full feed
        run: python -m scripts.epicentr.export_feed

      # ======================================================
      # EPICENTR - MANUAL PRODUCTS
      # ======================================================

      - name: Check Epicentr manual products XML
        run: |
          echo "========================================"
          echo "EPICENTR MANUAL PRODUCTS CHECK"
          echo "========================================"

          if [ ! -f data/manual/epicentr_manual_products.xml ]; then
            echo "ERROR: data/manual/epicentr_manual_products.xml not found"
            exit 1
          fi

          echo "Manual Epicentr XML found."

          echo
          echo "===== MANUAL FILE SIZE ====="
          ls -lh data/manual/epicentr_manual_products.xml

          echo
          echo "===== MANUAL OFFERS COUNT ====="

          MANUAL_COUNT=$(grep -c "<offer " data/manual/epicentr_manual_products.xml || true)

          echo "Manual offers: $MANUAL_COUNT"

          echo
          echo "===== MANUAL XML CONTENT ====="
          cat data/manual/epicentr_manual_products.xml

      # ======================================================
      # EPICENTR - UPDATE FEED
      # supplier + manual + history
      # ======================================================

      - name: Export Epicentr updates feed
        run: python -m scripts.epicentr.export_updates_with_history

      # ======================================================
      # EPICENTR - CHECK FINAL RESULT
      # ======================================================

      - name: Check Epicentr updates result
        run: |
          echo "========================================"
          echo "EPICENTR UPDATES RESULT"
          echo "========================================"

          if [ ! -f data/output/epicentr/epicentr_updates.xml ]; then
            echo "ERROR: epicentr_updates.xml was not created"
            exit 1
          fi

          echo "Epicentr updates XML created."

          echo
          echo "===== FILE SIZE ====="
          ls -lh data/output/epicentr/epicentr_updates.xml

          echo
          echo "===== TOTAL OFFERS ====="

          TOTAL_COUNT=$(grep -c "<offer " data/output/epicentr/epicentr_updates.xml || true)

          echo "Total offers: $TOTAL_COUNT"

          echo
          echo "===== CHECK ALL MANUAL PRODUCTS ====="

          python - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          manual_file = "data/manual/epicentr_manual_products.xml"
          output_file = "data/output/epicentr/epicentr_updates.xml"

          manual_root = ET.parse(manual_file).getroot()
          output_root = ET.parse(output_file).getroot()

          manual_offers = manual_root.findall(".//offer")
          output_offers = output_root.findall(".//offer")

          manual_ids = {
              offer.get("id")
              for offer in manual_offers
              if offer.get("id")
          }

          output_ids = {
              offer.get("id")
              for offer in output_offers
              if offer.get("id")
          }

          print(f"Manual products: {len(manual_ids)}")
          print(f"Final XML products: {len(output_ids)}")

          if not manual_ids:
              print("No manual products found.")
              sys.exit(0)

          missing = []

          for product_id in sorted(manual_ids):
              if product_id in output_ids:
                  print(f"OK: {product_id} found in final XML")
              else:
                  print(f"ERROR: {product_id} NOT FOUND in final XML")
                  missing.append(product_id)

          if missing:
              print()
              print("Missing manual products:")

              for product_id in missing:
                  print(f"- {product_id}")

              sys.exit(1)

          print()
          print("ALL MANUAL PRODUCTS FOUND IN FINAL XML")
          PY

      # ======================================================
      # EPICENTR - SHOW MANUAL PRODUCTS FROM FINAL XML
      # ======================================================

      - name: Show manual products in final Epicentr XML
        run: |
          echo "========================================"
          echo "MANUAL PRODUCTS IN FINAL EPICENTR XML"
          echo "========================================"

          python - <<'PY'
          import xml.etree.ElementTree as ET

          manual_file = "data/manual/epicentr_manual_products.xml"
          output_file = "data/output/epicentr/epicentr_updates.xml"

          manual_root = ET.parse(manual_file).getroot()
          output_root = ET.parse(output_file).getroot()

          manual_ids = {
              offer.get("id")
              for offer in manual_root.findall(".//offer")
              if offer.get("id")
          }

          for offer in output_root.findall(".//offer"):
              product_id = offer.get("id")

              if product_id not in manual_ids:
                  continue

              print("----------------------------------------")
              print(f"ID: {product_id}")
              print(f"available: {offer.get('available')}")

              price = offer.findtext("price")
              price_old = offer.findtext("price_old")
              availability = offer.findtext("availability")

              print(f"price: {price}")
              print(f"price_old: {price_old}")
              print(f"availability: {availability}")

          print("----------------------------------------")
          PY

      # ======================================================
      # ROZETKA
      # ======================================================

      - name: Export Rozetka feed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.rozetka.export_feed

      # ======================================================
      # DEBUG OUTPUT
      # ======================================================

      - name: Debug output feeds
        run: |
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          find data/output -maxdepth 3 -type f -print

          echo
          echo "===== EPICENTR FULL FEED ====="

          if [ -f data/output/epicentr/epicentr_feed.xml ]; then
            ls -lh data/output/epicentr/epicentr_feed.xml
          else
            echo "epicentr_feed.xml NOT FOUND"
          fi

          echo
          echo "===== EPICENTR UPDATES FEED ====="

          if [ -f data/output/epicentr/epicentr_updates.xml ]; then
            ls -lh data/output/epicentr/epicentr_updates.xml
          else
            echo "epicentr_updates.xml NOT FOUND"
          fi

          echo
          echo "===== ROZETKA FEED ====="

          if [ -f data/output/rozetka/rozetka_feed.xml ]; then
            ls -lh data/output/rozetka/rozetka_feed.xml
          else
            echo "rozetka_feed.xml NOT FOUND"
          fi

          echo
          echo "===== CHECK SUPPLIER SKU IN OUTPUT ====="

          grep -R "M 4259EBLR-1" data/output/ \
            || echo "M 4259EBLR-1 NOT FOUND IN OUTPUT"

      # ======================================================
      # GIT STATUS
      # ======================================================

      - name: Show git status
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status

      # ======================================================
      # COMMIT + PUSH
      # ======================================================

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "GIT STATUS BEFORE ADD"
          echo "========================================"

          git status

          echo
          echo "===== ADD GENERATED FILES ====="

          git add \
            state/fetch_meta.json \
            state/epicentr_known_products.json \
            data/raw/ \
            data/output/

          echo
          echo "===== STAGED CHANGES ====="

          git diff --cached --stat

          echo
          echo "===== CHECK FOR CHANGES ====="

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo
          echo "===== COMMIT ====="

          git commit -m "Auto-update product feeds"

          echo
          echo "===== SYNC WITH REMOTE MAIN ====="

          git pull --rebase origin main

          echo
          echo "===== PUSH ====="

          git push origin main
